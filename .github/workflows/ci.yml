name: CI

# 什么时候触发
on:
  push:
    branches:
      - main
      - online
  pull_request:
    branches:
      - main
      - online

# 取消同一分支上正在运行的旧流水线，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10

# ─── 纯 CI：在 GitHub 云端完成 检查 → 测试 → 构建 ──────────────
# 不触碰任何服务器，验证代码质量与可构建性。
# 构建产物（dist/）作为 artifact 上传，供后续手动部署或 CD 使用。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 注意：项目当前未把 pnpm-lock.yaml 提交到 git，
      # 故这里不使用 --frozen-lockfile（否则 CI 会因缺少 lockfile 报错）。
      # 建议后续把 pnpm-lock.yaml 提交进仓库，再改回：
      #   pnpm install --frozen-lockfile
      - name: Install dependencies
        run: pnpm install

      - name: Format Check
        run: pnpm format:check

      - name: Type Check
        run: pnpm check

      # 说明：当前项目还没有任何测试文件（server/**/*.test.ts 等），
      # vitest 在无测试时会以失败退出，故暂不跑 test。
      # 后续补上测试后，取消下方注释即可启用：
      # - name: Test
      #   run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle Budget Check
        run: pnpm perf:bundle

      # 把自包含的 dist/ 目录上传为构建产物（保留 7 天）
      # 这是 CI 与部署之间的边界：产物在此交付，部署由 CD 负责
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
